name: Discord Bot CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: discord_test
          POSTGRES_USER: discord_test
          POSTGRES_PASSWORD: discord_test
        options: --health-cmd "pg_isready -U discord_test -d discord_test" --health-interval 5s --health-timeout 3s --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://discord_test:discord_test@127.0.0.1:5432/discord_test
      TEST_DATABASE_URL: postgresql://discord_test:discord_test@127.0.0.1:5432/discord_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: discord-bot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
