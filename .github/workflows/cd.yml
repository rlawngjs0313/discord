name: Discord Bot CD (Deploy)

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to GCE via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCE_IP }}
          username: ${{ secrets.GCE_USERNAME }}
          key: ${{ secrets.GCE_SSH_SECRET_KEY }}
          script: |
            # GHCR 로그인
            echo ${{ secrets.GITHUB_TOKEN }} | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 기존 컨테이너 중지 및 제거
            sudo docker ps -q --filter "name=discord-bot" | xargs -r sudo docker stop
            sudo docker ps -a -q --filter "name=discord-bot" | xargs -r sudo docker rm
            
            # 최신 이미지 풀
            sudo docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # 새 컨테이너 실행 (80포트 매핑)
            sudo docker run -d \
              --name discord-bot \
              --restart always \
              -p 80:8000 \
              -e DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }} \
              -e DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }} \
              -e DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }} \
              -e DISCORD_REDIRECT_URI=${{ secrets.DISCORD_REDIRECT_URI }} \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # 사용하지 않는 이미지 정리
            sudo docker image prune -f
