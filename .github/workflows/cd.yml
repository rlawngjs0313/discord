name: Discord Bot CD (Deploy)

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to GCE via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          BOT_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_RESPONSE_KEY: ${{ secrets.DISCORD_RESPONSE_KEY }}
          DATABASE_URL: ${{ secrets.DISCORD_DATABASE_URL }}
        with:
          host: ${{ secrets.GCE_IP }}
          username: ${{ secrets.GCE_USERNAME }}
          key: ${{ secrets.GCE_SSH_SECRET_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,BOT_IMAGE,DISCORD_TOKEN,DISCORD_CLIENT_ID,DISCORD_RESPONSE_KEY,DATABASE_URL
          script: |
            set -eu
            : "${DISCORD_TOKEN:?Missing Discord bot token}"
            : "${DISCORD_CLIENT_ID:?Missing Discord application ID}"
            : "${DISCORD_RESPONSE_KEY:?Missing response encryption key}"
            : "${DATABASE_URL:?Missing Discord PostgreSQL URL}"
            image=$(printf '%s' "$BOT_IMAGE" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sudo docker pull "$image"
            if sudo docker container inspect discord-bot >/dev/null 2>&1; then
              sudo docker rm -f discord-bot
            fi
            sudo --preserve-env=DISCORD_TOKEN,DISCORD_CLIENT_ID,DISCORD_RESPONSE_KEY,DATABASE_URL docker run -d \
              --name discord-bot --restart always \
              -e DISCORD_TOKEN -e DISCORD_CLIENT_ID -e DISCORD_RESPONSE_KEY -e DATABASE_URL \
              "$image"
