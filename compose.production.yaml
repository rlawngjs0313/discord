name: discord-settlement

services:
  bot:
    image: ${BOT_IMAGE:?Set BOT_IMAGE to the published GHCR image digest}
    env_file: bot.env
    environment:
      DISCORD_READY_FILE: /tmp/discord-ready
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, test, -f, /tmp/discord-ready]
      interval: 5s
      timeout: 2s
      start_period: 45s
      retries: 6

  postgres:
    image: postgres:17-alpine
    env_file: postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
